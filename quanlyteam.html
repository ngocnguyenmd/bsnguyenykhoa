<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STUDIO CAST</title>
<style>
:root{
  --bg-deep:#0c0908;--bg:#14100d;--card:#1c1714;--card-2:#241c17;
  --border:#332820;--border-soft:#2a221c;
  --amber:#d4a574;--amber-soft:#e8c8a0;--amber-deep:#8a6440;
  --red:#c64a3a;--green:#7a9a5a;--text:#ede0cc;--muted:#8a7868;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-deep);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(212,165,116,.07),transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(198,74,58,.05),transparent 60%),
    linear-gradient(180deg,var(--bg-deep),var(--bg));
  background-attachment:fixed;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(212,165,116,.03) 1px,transparent 0);
  background-size:22px 22px}

.app{height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;padding:10px;gap:8px;animation:appIn .5s ease}
@keyframes appIn{from{opacity:0}to{opacity:1}}

/* === HEADER === */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);flex-shrink:0;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--amber-deep));display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--bg-deep);flex-shrink:0}
.brand-text h1{font-size:16px;font-weight:800;line-height:1.1}
.brand-text p{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}

.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:linear-gradient(135deg,var(--amber),var(--amber-deep));border-color:var(--amber);color:var(--bg-deep);font-weight:800}
.btn.primary:hover{box-shadow:0 4px 12px rgba(212,165,116,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.api-bar{display:flex;gap:5px;align-items:center}
.api-input{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text);font-family:inherit;font-size:11px;width:160px;outline:none}
.api-input:focus{border-color:var(--amber)}
.api-input::placeholder{color:var(--muted);font-size:10px}
.api-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;transition:background .3s}
.api-dot.on{background:var(--green);box-shadow:0 0 6px rgba(122,154,90,.5)}

/* === BODY LAYOUT === */
.body-wrap{flex:1;display:flex;gap:8px;min-height:0;overflow:hidden}

/* === SIDEBAR (có thu gọn) === */
.sidebar{width:160px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:width .3s ease,opacity .3s;overflow:hidden;flex-shrink:0}
.sidebar.collapsed{width:42px}
.sidebar-head{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 8px;border-bottom:1px dashed var(--border-soft);flex-shrink:0}
.sidebar-title{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .sidebar-title{display:none}
.sidebar-count{font-size:10px;color:var(--amber);font-weight:700;background:rgba(212,165,116,.1);padding:2px 6px;border-radius:6px;flex-shrink:0}
.sidebar.collapsed .sidebar-count{display:none}
.toggle-btn{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--card-2);color:var(--muted);font-size:11px;cursor:pointer;display:grid;place-items:center;transition:all .2s;flex-shrink:0}
.toggle-btn:hover{border-color:var(--amber);color:var(--amber)}

.fb-list{flex:1;overflow-y:auto;padding:6px;overflow-x:hidden}
.sidebar.collapsed .fb-list{padding:6px 4px}
.fb-list::-webkit-scrollbar{width:3px}
.fb-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.fb-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:10px;cursor:pointer;transition:background .15s;flex-shrink:0}
.fb-item:hover{background:var(--card-2)}
.fb-item.active{background:var(--card-2)}
.sidebar.collapsed .fb-item{justify-content:center;padding:5px 2px}
.fb-av{width:30px;height:30px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--amber),var(--amber-deep));flex-shrink:0}
.fb-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:1.5px solid var(--card)}
.fb-item.active .fb-av{box-shadow:0 0 8px rgba(212,165,116,.4)}
.fb-nm{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-item.active .fb-nm{color:var(--amber)}
.sidebar.collapsed .fb-nm{display:none}

/* === MAIN CONTENT === */
.main{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}

/* Comic panel + info */
.top-section{display:grid;grid-template-columns:160px 1fr;gap:12px;flex-shrink:0}
@media(max-width:700px){.top-section{grid-template-columns:1fr}}

.comic-panel{width:160px;height:260px;border-radius:10px;background:linear-gradient(135deg,#2a221c,#1a1512);overflow:hidden;position:relative;border:2px solid var(--border);box-shadow:0 6px 16px rgba(0,0,0,.4)}
@media(max-width:700px){.comic-panel{width:120px;height:180px;margin:0 auto}}
.comic-panel img{width:100%;height:100%;object-fit:cover;display:block}
.comic-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);padding:2px 7px;border-radius:5px;font-size:9px;font-weight:700;color:var(--amber);letter-spacing:.8px;border:1px solid rgba(212,165,116,.25)}

.comic-chat{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 50%,transparent);padding:8px;pointer-events:none}
.comic-bubble{background:var(--card-2);border:1.5px solid var(--amber-deep);border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.4;color:var(--amber-soft);position:relative;opacity:0;transform:translateY(4px);transition:all .35s ease;word-break:break-word}
.comic-bubble.show{opacity:1;transform:translateY(0)}
.comic-bubble::before{content:'';position:absolute;top:-5px;left:14px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:5px solid var(--amber-deep)}
.comic-bubble::after{content:'';position:absolute;top:-3.5px;left:15px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:4px solid var(--card-2)}
.comic-bubble .t span{display:inline;animation:td 1.2s infinite;font-size:14px}
.comic-bubble .t span:nth-child(2){animation-delay:.2s}
.comic-bubble .t span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{opacity:.2}30%{opacity:1}}

/* Info bên cạnh */
.info-side{display:flex;flex-direction:column;gap:3px;min-width:0}
.info-side h2{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
@media(max-width:700px){.info-side h2{font-size:18px;text-align:center}}
.info-side .role{font-size:12px;color:var(--amber);font-weight:600}
@media(max-width:700px){.info-side .role{text-align:center}}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:11px}
.info-grid .lbl{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.8px}
.info-grid .val{color:var(--text);font-weight:600}

/* Task / Active nhỏ gọn */
.task-row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.task-chip{padding:4px 10px;border-radius:7px;background:var(--bg-deep);border:1px solid var(--border-soft);font-size:10.5px;color:var(--amber-soft);line-height:1.4;flex:1;min-width:120px}
.task-chip .tc-label{font-size:8.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
.task-chip .tc-val{color:var(--text);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* === KHUNG CHAT === */
.chat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat-head{padding:8px 12px;border-bottom:1px dashed var(--border-soft);font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;flex-shrink:0}
.chat-head .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.chat-msgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.chat-msgs::-webkit-scrollbar{width:3px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{max-width:82%;padding:7px 10px;border-radius:10px;font-size:12px;line-height:1.5;word-break:break-word;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--amber),var(--amber-deep));color:var(--bg-deep);border-bottom-right-radius:3px;font-weight:600}
.msg.ai{align-self:flex-start;background:var(--card-2);color:var(--text);border:1px solid var(--border-soft);border-bottom-left-radius:3px}
.msg.ai .typing-ind span{display:inline;animation:td 1.2s infinite;font-size:14px}
.msg.ai .typing-ind span:nth-child(2){animation-delay:.2s}
.msg.ai .typing-ind span:nth-child(3){animation-delay:.4px}

.chat-input-row{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border-soft);flex-shrink:0}
.chat-input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text);font-family:inherit;font-size:12px;outline:none;resize:none;min-height:36px;max-height:80px;line-height:1.4}
.chat-input:focus{border-color:var(--amber)}
.chat-input::placeholder{color:var(--muted);font-size:11px}
.chat-send{width:36px;height:36px;border-radius:8px;border:1px solid var(--amber);background:linear-gradient(135deg,var(--amber),var(--amber-deep));color:var(--bg-deep);font-size:16px;font-weight:900;cursor:pointer;display:grid;place-items:center;transition:all .15s;flex-shrink:0}
.chat-send:hover{box-shadow:0 3px 10px rgba(212,165,116,.3);transform:scale(1.05)}
.chat-send:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* === TOAST === */
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--amber);border-left:3px solid var(--amber);padding:10px 14px;border-radius:8px;color:var(--text);font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:toastIn .25s ease,toastOut .25s ease 2.5s forwards;max-width:260px;pointer-events:auto}
.toast.err{border-color:var(--red);border-left-color:var(--red)}
.toast.ok{border-color:var(--green);border-left-color:var(--green)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(100%);opacity:0}}

/* === SPLASH === */
.splash{position:fixed;inset:0;background:var(--bg-deep);display:grid;place-items:center;z-index:9998;transition:opacity .4s}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo{font-size:26px;font-weight:900;letter-spacing:4px;color:var(--amber);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.splash-bar{width:160px;height:2px;background:var(--card);border-radius:2px;overflow:hidden;margin:12px auto 0}
.splash-bar::after{content:'';display:block;width:30%;height:100%;background:var(--amber);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}

/* === 1366x768 === */
@media(max-height:768px){
  .comic-panel{height:220px}
  .top-section{gap:10px}
  .app{padding:8px;gap:6px}
  .header{padding:8px 12px}
}
/* === Samsung A32 (~360x800) === */
@media(max-width:400px){
  .app{padding:6px;gap:5px}
  .header{padding:6px 8px;gap:5px}
  .brand-text h1{font-size:14px}
  .brand-text p{display:none}
  .logo{width:32px;height:32px;font-size:15px}
  .api-input{width:100px;font-size:10px;padding:5px 7px}
  .btn{padding:5px 7px;font-size:10px}
  .sidebar{width:38px;border-radius:8px}
  .sidebar.collapsed{width:38px}
  .sidebar-head{padding:6px 4px}
  .sidebar-title,.sidebar-count{display:none}
  .fb-list{padding:4px 3px}
  .fb-av{width:28px;height:28px}
  .top-section{grid-template-columns:100px 1fr;gap:8px}
  .comic-panel{width:100px;height:160px}
  .info-side h2{font-size:16px}
  .info-grid{gap:2px 8px;font-size:10px}
  .task-row{gap:4px}
  .task-chip{padding:3px 7px;font-size:9.5px;min-width:0}
  .chat-box{border-radius:8px}
  .chat-input{font-size:11px;padding:6px 10px;min-height:32px}
  .chat-send{width:32px;height:32px;font-size:14px}
  .msg{font-size:11px;padding:6px 8px}
}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div style="text-align:center">
    <div class="splash-logo">STUDIO CAST</div>
    <div class="splash-bar"></div>
  </div>
</div>

<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="logo">◆</div>
      <div class="brand-text">
        <h1>STUDIO CAST</h1>
        <p>Hậu trường</p>
      </div>
    </div>
    <div class="controls">
      <div class="api-bar">
        <input class="api-input" id="apiKeyInput" type="password" placeholder="Groq API Key...">
        <button class="btn primary" id="apiBtn" style="padding:6px 9px;font-size:10px">OK</button>
        <div class="api-dot" id="apiDot" title="AI"></div>
      </div>
      <button class="btn" id="prevBtn" disabled>‹</button>
      <button class="btn primary" id="randomBtn" disabled>⟳</button>
      <button class="btn" id="nextBtn" disabled>›</button>
    </div>
  </header>

  <!-- BODY -->
  <div class="body-wrap">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">Nhân vật</span>
        <span class="sidebar-count" id="castCount">0</span>
        <button class="toggle-btn" id="toggleSidebar" title="Thu gọn">◀</button>
      </div>
      <div class="fb-list" id="castList">
        <div style="text-align:center;color:var(--muted);font-size:11px;padding:16px 6px">Đang quét...</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main" id="mainContent">
      <div style="flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px">
        <div><div style="font-size:40px;margin-bottom:8px;opacity:.4">🖼️</div><p style="font-size:12px">Đang tải...</p></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>
<input type="file" id="fileInputInfo" accept=".txt" style="display:none">

<script>
var state={cast:[],activities:[],actions:[],currentIdx:0,mode:'auto',groqKey:'',groqReady:false,bossInfo:null,chatMessages:[]};
var $=function(s){return document.querySelector(s);};

function toast(m,t){var e=document.createElement('div');e.className='toast'+(t==='err'?' err':t==='ok'?' ok':'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(function(){e.remove();},2800);}
function pick(a,e){if(!a.length)return'';if(a.length===1)return a[0];var v;do{v=a[Math.floor(Math.random()*a.length)];}while(v===e);return v;}

/* PARSE */
function parseTaskText(t){return t.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length>0;});}
function parseActiveText(t){return t.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length>0;}).map(function(l){var p=l.split('|');return{action:p[0].trim(),location:p[1]?p[1].trim():''};});}
function parseInfoText(t){var l=t.split(/\r?\n/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;});if(l.length>0){var p=l[0].split('|').map(function(x){return x.trim();});return{name:p[0]||'?',birth:p[1]||'—',location:p[2]||'—',school:p[3]||'—',height:p[4]||'—'};}return{name:'?',birth:'—',location:'—',school:'—',height:'—'};}
function parseBossText(t){var l=t.split(/\r?\n/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;});var o={name:'Boss',role:'—',note:'—'};l.forEach(function(x){if(x.indexOf('|')>-1){var p=x.split('|');o.name=p[0].trim()||o.name;o.role=p[1]?p[1].trim():o.role;o.note=p[2]?p[2].trim():o.note;}else if(o.name==='Boss')o.name=x;});return o;}

function fetchFile(u){return new Promise(function(r){var x=new XMLHttpRequest();x.open('GET',u,true);x.onload=function(){r(x.status===200||x.status===0?x.responseText:null);};x.onerror=function(){r(null);};x.send();});}

/* GROQ */
async function groqChat(sys,usr,max){
  if(!state.groqReady)return null;
  try{var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.groqKey},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:max||60,temperature:1.0})});
  if(!r.ok)return null;var d=await r.json();return d.choices&&d.choices[0]?d.choices[0].message.content.trim():null;}catch(e){return null;}}

/* CHAT VỢ TỰ ĐỘNG (bubble) */
var chatTopics=['hỏi ăn cơm chưa','dỗi vì chồng bận quá','nhắc đi làm về sớm','chê lướt điện thoại','hỏi đang làm gì','buồn vì ít nói chuyện','nhắc uống nước','hỏi có nhớ mình không','dỗi không rep tin nhắn','nhắc tắm đi ngủ','hỏi tối ăn gì','chê thức khuya','nhắc mai có lịch gì','hỏi đang ở đâu','nhớ chồng','dỗi không gọi điện','nhắc mua gì về','chê lười','hỏi có mệt không','nhắc đừng hút thuốc'];
var chatHist=[],lastBubble='';
function getTopic(){var a=chatTopics.filter(function(t){return chatHist.indexOf(t)===-1;});if(!a.length){chatHist=chatHist.slice(4);a=chatTopics.filter(function(t){return chatHist.indexOf(t)===-1;});}var c=a[Math.floor(Math.random()*a.length)];chatHist.push(c);if(chatHist.length>8)chatHist.shift();return c;}

var bubbleEl=null,bubbleTimer=null,bubbleCool=false;
function startBubble(){stopBubble();if(!state.groqReady)return;setTimeout(function(){if(state.groqReady)fireBubble();},6000);bubbleTimer=setInterval(function(){if(!bubbleCool)fireBubble();},38000);}
function stopBubble(){if(bubbleTimer){clearInterval(bubbleTimer);bubbleTimer=null;}}
async function fireBubble(){
  if(!state.groqReady||bubbleCool||!bubbleEl)return;bubbleCool=true;
  bubbleEl.innerHTML='<span class="t"><span>.</span><span>.</span><span>.</span></span>';bubbleEl.classList.add('show');
  var boss=state.bossInfo?state.bossInfo.name:'anh';
  var r=await groqChat('Bạn là vợ của '+boss+'. Nói tiếng Việt bình dân. Bạn muốn '+getTopic()+'. Nói đúng 1 câu, dưới 15 chữ.','Nói đi',35);
  if(r){var c=r.split('\n')[0].replace(/[\*\(\)\[\]""'']/g,'').trim();if(c.length>45)c=c.substring(0,42)+'...';if(c===lastBubble){bubbleEl.classList.remove('show');bubbleCool=false;return;}lastBubble=c;bubbleEl.textContent=c;bubbleEl.classList.add('show');}else{bubbleEl.classList.remove('show');}
  setTimeout(function(){if(bubbleEl)bubbleEl.classList.remove('show');},13000);
  setTimeout(function(){bubbleCool=false;},16000);
}

/* CHAT MANUAL */
var chatMsgsEl=null,chatInputEl=null,chatSendBtn=null,chatSending=false;

function buildChatSystemPrompt(){
  var boss=state.bossInfo?state.bossInfo.name:'chồng';
  var tasks=state.activities.length>0?state.activities.slice(0,8).join(', '):'chưa rõ';
  var actives=state.actions.length>0?state.actions.slice(0,5).map(function(a){return a.action;}).join(', '):'chưa rõ';
  return 'Bạn là người yêu/vợ của '+boss+'. Bạn nói tiếng Việt bình dân, tự nhiên, hay dỗi, đôi khi ngọt ngào. '+
    'Thông tin về '+boss+': task = '+tasks+'. active = '+actives+'. '+
    'Trả lời ngắn gọn, tự nhiên, như chat thật. Dưới 30 chữ.';
}

function addChatMsg(text,isMe){
  if(!chatMsgsEl)return;
  var d=document.createElement('div');
  d.className='msg '+(isMe?'me':'ai');
  if(!isMe&&text==='__typing__'){d.innerHTML='<span class="typing-ind"><span>.</span><span>.</span><span>.</span></span>';}
  else{d.textContent=text;}
  chatMsgsEl.appendChild(d);
  chatMsgsEl.scrollTop=chatMsgsEl.scrollHeight;
  return d;
}

async function sendChat(){
  var msg=chatInputEl.value.trim();
  if(!msg||chatSending||!state.groqReady)return;
  chatSending=true;
  chatInputEl.value='';
  addChatMsg(msg,true);
  state.chatMessages.push({role:'user',content:msg});
  if(state.chatMessages.length>12)state.chatMessages=state.chatMessages.slice(-10);
  var typingEl=addChatMsg('__typing__',false);
  var sysPrompt=buildChatSystemPrompt();
  var apiMsgs=[{role:'system',content:sysPrompt}].concat(state.chatMessages.slice(-8));
  var reply=await groqChat(sysPrompt,msg,80);
  if(typingEl)typingEl.remove();
  if(reply){var clean=reply.split('\n')[0].replace(/[\*\(\)\[\]""'']/g,'').trim();addChatMsg(clean,false);state.chatMessages.push({role:'assistant',content:clean});}
  else{addChatMsg('...',false);}
  chatSending=false;
}

/* TOGGLE SIDEBAR */
function toggleSidebar(){
  var sb=$('#sidebar');sb.classList.toggle('collapsed');
  var btn=$('#toggleSidebar');btn.textContent=sb.classList.contains('collapsed')?'▶':'◀';
}

/* LOAD DATA */
async function autoLoadAll(){
  var r=await Promise.all([fetchFile('./boss.txt'),fetchFile('./task/task.txt'),fetchFile('./task/active.txt')]);
  if(r[0])state.bossInfo=parseBossText(r[0]);
  if(r[1])state.activities=parseTaskText(r[1]);
  if(r[2])state.actions=parseActiveText(r[2]);
  var l=[];if(r[0])l.push('boss');if(r[1])l.push('task');if(r[2])l.push('active');
  if(l.length)toast('Đã tải: '+l.join(', '),'ok');
  if(state.cast.length>0)renderProfile();
  startTimers();
}

function autoScanImages(){
  var found=0,done=0,total=60;
  for(var i=1;i<=total;i++){(function(idx){
    var id=String(idx).padStart(2,'0');var img=new Image();
    img.onload=function(){state.cast.push({id:id,imgSrc:'./source/'+id+'.jpg'});found++;done++;chk();};
    img.onerror=function(){done++;chk();};img.src='./source/'+id+'.jpg';
  })(i);}
  function chk(){if(done>=total){
    if(found>0){state.cast.sort(function(a,b){return parseInt(a.id)-parseInt(b.id);});renderCastList();
      $('#prevBtn').disabled=false;$('#nextBtn').disabled=false;$('#randomBtn').disabled=false;toast(found+' ảnh','ok');
      var i01=state.cast.findIndex(function(c){return c.id==='01';});if(i01>-1){state.currentIdx=i01;renderCastList();autoLoadInfo(state.cast[i01]);}
      if(state.bossInfo||state.activities.length)renderProfile();
    }else{toast('Không tìm thấy ảnh!','err');}
  }}
}

async function autoLoadInfo(p){var t=await fetchFile('./Pro/'+p.id+'.txt');if(t){p.info=parseInfoText(t);if(state.cast[state.currentIdx]&&state.cast[state.currentIdx].id===p.id)renderProfile();}}

function renderCastList(){
  var el=$('#castList');el.innerHTML='';
  state.cast.forEach(function(p,i){
    var d=document.createElement('div');d.className='fb-item'+(i===state.currentIdx?' active':'');
    d.innerHTML='<div class="fb-av"><img src="'+p.imgSrc+'" alt="'+p.id+'"></div><div class="fb-nm">'+p.id+'</div>';
    d.addEventListener('click',function(){state.currentIdx=i;renderCastList();renderProfile();if(!p.info)autoLoadInfo(p);resetTimers();});
    el.appendChild(d);
  });
  $('#castCount').textContent=state.cast.length;
}

/* === RENDER PROFILE (bỏ bio, bỏ timer, có task/active chips) === */
function renderProfile(){
  var main=$('#mainContent');var p=state.cast[state.currentIdx];
  if(!p){main.innerHTML='<div style="flex:1;display:grid;place-items:center;color:var(--muted)"><p>Chọn nhân vật</p></div>';return;}
  var info=p.info||{name:'ID '+p.id,birth:'—',location:'—',school:'—',height:'—'};
  var taskAct='—',activeDet='—';
  if(state.activities.length>0)taskAct=pick(state.activities);
  if(state.actions.length>0){var a=pick(state.actions);activeDet=a.action+(a.location?' '+a.location:'');}

  main.innerHTML=
    '<div class="top-section">'+
      '<div class="comic-panel">'+
        '<img src="'+p.imgSrc+'" alt="'+p.id+'">'+
        '<div class="comic-badge">#'+p.id+'</div>'+
        '<div class="comic-chat"><div class="comic-bubble" id="chatBubble"></div></div>'+
      '</div>'+
      '<div class="info-side">'+
        '<h2>'+info.name+'</h2>'+
        '<div class="role">'+info.birth+'</div>'+
        '<div class="info-grid">'+
          '<div><div class="lbl">Nơi sinh</div><div class="val">'+info.location+'</div></div>'+
          '<div><div class="lbl">Chiều cao</div><div class="val">'+info.height+'</div></div>'+
          '<div><div class="lbl">Học vấn</div><div class="val" style="grid-column:span 2">'+info.school+'</div></div>'+
        '</div>'+
        '<div class="task-row">'+
          '<div class="task-chip"><span class="tc-label">Nhiệm vụ</span><span class="tc-val" id="taskVal">'+taskAct+'</span></div>'+
          '<div class="task-chip"><span class="tc-label">Active</span><span class="tc-val" id="activeVal">'+activeDet+'</span></div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="chat-box">'+
      '<div class="chat-head"><span class="live-dot"></span>Chat với '+info.name+'</div>'+
      '<div class="chat-msgs" id="chatMsgs"></div>'+
      '<div class="chat-input-row">'+
        '<textarea class="chat-input" id="chatInput" placeholder="Nhập tin nhắn..." rows="1"></textarea>'+
        '<button class="chat-send" id="chatSend">➤</button>'+
      '</div>'+
    '</div>';

  bubbleEl=$('#chatBubble');
  chatMsgsEl=$('#chatMsgs');
  chatInputEl=$('#chatInput');
  chatSendBtn=$('#chatSend');

  chatSendBtn.addEventListener('click',sendChat);
  chatInputEl.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
  });
  /* Auto-resize textarea */
  chatInputEl.addEventListener('input',function(){
    this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';
  });

  /* Khôi phục chat history */
  state.chatMessages.forEach(function(m){
    addChatMsg(m.content,m.role==='user');
  });
}

/* HOẠT ĐỘNG */
function nextPerson(){if(!state.cast.length)return;state.currentIdx=(state.currentIdx+1)%state.cast.length;renderCastList();renderProfile();if(!state.cast[state.currentIdx].info)autoLoadInfo(state.cast[state.currentIdx]);resetTimers();}
function prevPerson(){if(!state.cast.length)return;state.currentIdx=(state.currentIdx-1+state.cast.length)%state.cast.length;renderCastList();renderProfile();if(!state.cast[state.currentIdx].info)autoLoadInfo(state.cast[state.currentIdx]);resetTimers();}
function randomPerson(){if(state.cast.length<2)return;var n;do{n=Math.floor(Math.random()*state.cast.length);}while(n===state.currentIdx);state.currentIdx=n;renderCastList();renderProfile();if(!state.cast[state.currentIdx].info)autoLoadInfo(state.cast[state.currentIdx]);resetTimers();}

/* TIMERS (chỉ đổi task/active, không timer hiển thị) */
var taskInt=null,activeInt=null,activeStart=0;
var ACTIVE_MS=60000,TASK_MS=1200000;
function startTimers(){stopTimers();if(!state.activities.length)return;activeStart=Date.now();
  activeInt=setInterval(function(){if(!state.actions.length)return;var a=pick(state.actions);var el=$('#activeVal');if(el)el.textContent=a.action+(a.location?' '+a.location:'');},ACTIVE_MS);
  taskInt=setInterval(function(){if(!state.activities.length)return;var el=$('#taskVal');if(el)el.textContent=pick(state.activities,el.textContent);},TASK_MS);
}
function stopTimers(){if(taskInt){clearInterval(taskInt);taskInt=null;}if(activeInt){clearInterval(activeInt);activeInt=null;}}
function resetTimers(){startTimers();}

/* API KEY */
function handleApiKey(){
  var k=$('#apiKeyInput').value.trim();if(!k){toast('Nhập Key','err');return;}
  state.groqKey=k;$('#apiBtn').textContent='...';$('#apiBtn').disabled=true;
  fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:'ok'}],max_tokens:2})})
  .then(function(r){if(r.ok){state.groqReady=true;$('#apiDot').classList.add('on');$('#apiBtn').textContent='OK';toast('AI sẵn sàng!','ok');startBubble();}else throw new Error(r.status);})
  .catch(function(e){state.groqReady=false;$('#apiBtn').textContent='OK';$('#apiBtn').disabled=false;toast('Lỗi: '+e.message,'err');});
}

/* KEYBOARD */
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(!state.cast.length)return;if(e.code==='Space'){e.preventDefault();randomPerson();}else if(e.code==='ArrowLeft')prevPerson();else if(e.code==='ArrowRight')nextPerson();});

/* INIT */
function init(){
  $('#toggleSidebar').addEventListener('click',toggleSidebar);
  $('#prevBtn').addEventListener('click',prevPerson);
  $('#nextBtn').addEventListener('click',nextPerson);
  $('#randomBtn').addEventListener('click',randomPerson);
  $('#apiBtn').addEventListener('click',handleApiKey);
  $('#apiKeyInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();handleApiKey();}});
  $('#fileInputInfo').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var p=state.cast[state.currentIdx];if(p){p.info=parseInfoText(ev.target.result);toast('Đã tải '+f.name,'ok');renderProfile();}};r.readAsText(f);e.target.value='';});

  setTimeout(function(){$('#splash').classList.add('hide');setTimeout(function(){$('#splash').remove();},400);},500);
  autoScanImages();
  autoLoadAll();
}
init();
</script>
</body>
</html>
