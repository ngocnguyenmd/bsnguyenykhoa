<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOVE CAST</title>
<style>
:root{
  --bg:#080a0f;--bg2:#0e1118;--card:#13161e;--card2:#1a1e28;
  --border:#222838;--border2:#1c2030;
  --blue:#6b8aff;--blue-s:#9bb0ff;--blue-d:#3a52a0;
  --pink:#e87ba5;--pink-s:#f4a8c4;--pink-d:#a0486e;
  --purple:#a78bfa;--text:#d8dce8;--muted:#5c6380;
  --shadow:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(ellipse 70% 40% at 15% 10%,rgba(107,138,255,.06),transparent 50%),
    radial-gradient(ellipse 50% 35% at 85% 90%,rgba(232,123,165,.05),transparent 50%),
    radial-gradient(ellipse 40% 30% at 50% 50%,rgba(167,139,250,.03),transparent 50%),
    var(--bg);
}
/* Stars */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.25),transparent),
    radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,.15),transparent),
    radial-gradient(1.5px 1.5px at 55% 15%,rgba(255,255,255,.2),transparent),
    radial-gradient(1px 1px at 70% 55%,rgba(255,255,255,.12),transparent),
    radial-gradient(1px 1px at 85% 35%,rgba(255,255,255,.18),transparent),
    radial-gradient(1.5px 1.5px at 20% 85%,rgba(255,255,255,.1),transparent),
    radial-gradient(1px 1px at 45% 45%,rgba(255,255,255,.08),transparent),
    radial-gradient(1px 1px at 92% 78%,rgba(255,255,255,.14),transparent);
  background-size:200px 200px,300px 300px,250px 250px,180px 180px,350px 350px,220px 220px,280px 280px,160px 160px;
  animation:stars 120s linear infinite;
}
@keyframes stars{to{background-position:200px 200px,300px 300px,250px 250px,180px 180px,350px 350px,220px 220px,280px 280px,160px 160px}}

.app{height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;padding:10px;gap:8px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);flex-shrink:0;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple),var(--blue));display:grid;place-items:center;box-shadow:0 0 16px rgba(167,139,250,.3);position:relative}
.logo::after{content:'♥';font-size:16px;color:#fff}
.brand-text h1{font-size:16px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--pink-s),var(--purple),var(--blue-s));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-text p{font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--purple);color:var(--purple)}
.btn.pri{background:linear-gradient(135deg,var(--blue-d),var(--purple));border-color:var(--purple);color:#fff;font-weight:700}
.btn.pri:hover{box-shadow:0 3px 12px rgba(167,139,250,.3)}
.btn.dn{border-color:var(--pink-d);color:var(--pink)}
.btn.dn:hover{background:rgba(232,123,165,.1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.api-bar{display:flex;gap:5px;align-items:center}
.api-in{padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;font-size:10px;width:140px;outline:none}
.api-in:focus{border-color:var(--purple)}
.api-in::placeholder{color:var(--muted);font-size:9px}
.api-dot{width:7px;height:7px;border-radius:50%;background:var(--pink-d);flex-shrink:0;transition:all .3s}
.api-dot.on{background:var(--blue);box-shadow:0 0 8px rgba(107,138,255,.5)}

/* Body */
.body-wrap{flex:1;display:flex;gap:8px;min-height:0;overflow:hidden}

/* Sidebar */
.sidebar{width:150px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:width .3s;overflow:hidden;flex-shrink:0}
.sidebar.off{width:40px}
.sb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 8px;border-bottom:1px solid var(--border2);flex-shrink:0}
.sb-title{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.sidebar.off .sb-title{display:none}
.sb-cnt{font-size:9px;color:var(--purple);font-weight:700;background:rgba(167,139,250,.1);padding:2px 6px;border-radius:6px}
.sidebar.off .sb-cnt{display:none}
.tog{width:20px;height:20px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:10px;cursor:pointer;display:grid;place-items:center;transition:all .2s;flex-shrink:0}
.tog:hover{border-color:var(--purple);color:var(--purple)}
.fb-list{flex:1;overflow-y:auto;padding:6px;overflow-x:hidden}
.sidebar.off .fb-list{padding:6px 3px}
.fb-list::-webkit-scrollbar{width:2px}
.fb-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.fb-i{display:flex;align-items:center;gap:8px;padding:4px 5px;border-radius:10px;cursor:pointer;transition:background .15s;flex-shrink:0}
.fb-i:hover{background:var(--card2)}
.fb-i.on{background:var(--card2)}
.sidebar.off .fb-i{justify-content:center;padding:4px 2px}
.fb-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid transparent;transition:all .2s}
.fb-i.on .fb-av{border-color:var(--purple);box-shadow:0 0 10px rgba(167,139,250,.3)}
.fb-av img{width:100%;height:100%;object-fit:cover;display:block}
.fb-nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-i.on .fb-nm{color:var(--purple)}
.sidebar.off .fb-nm{display:none}

/* Main */
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;overflow:hidden}

/* Avatar tròn lớn */
.avatar-wrap{position:relative;flex-shrink:0}
.avatar-circle{width:180px;height:180px;border-radius:50%;overflow:hidden;border:3px solid var(--border);box-shadow:0 0 40px rgba(167,139,250,.15),0 8px 30px rgba(0,0,0,.5);position:relative}
.avatar-circle img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-circle::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,transparent 60%,rgba(8,10,15,.7));pointer-events:none}
.bubble{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:12px;line-height:1.4;color:var(--text);white-space:nowrap;max-width:260px;opacity:0;transform:translateX(-50%) translateY(6px);transition:all .4s ease;pointer-events:none;z-index:2}
.bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bubble::before{content:'';position:absolute;top:-5px;left:50%;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:5px solid var(--border)}
.bubble::after{content:'';position:absolute;top:-4px;left:50%;margin-left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:4px solid var(--card2)}
.bubble .t span{display:inline;animation:td 1.2s infinite;font-size:14px}
.bubble .t span:nth-child(2){animation-delay:.2s}
.bubble .t span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{opacity:.2}30%{opacity:1}}

/* Collapse btn trên avatar */
.col-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--muted);font-size:11px;cursor:pointer;display:grid;place-items:center;z-index:3;transition:all .2s;backdrop-filter:blur(4px)}
.col-btn:hover{border-color:var(--purple);color:var(--purple)}

/* Info dưới avatar */
.info-area{text-align:center;max-width:400px;width:100%;flex-shrink:0}
.info-area h2{font-size:22px;font-weight:800;margin-bottom:2px;background:linear-gradient(90deg,var(--text),var(--blue-s));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.info-area .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:11px;text-align:left;margin-bottom:10px}
.info-grid .l{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.8px}
.info-grid .v{color:var(--text);font-weight:600}
.task-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.task-chip{padding:5px 10px;border-radius:8px;background:var(--card);border:1px solid var(--border2)}
.task-chip .tl{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;display:block;margin-bottom:1px}
.task-chip .tv{color:var(--text);font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Toast */
.toast-c{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--purple);border-left:3px solid var(--purple);padding:10px 14px;border-radius:8px;color:var(--text);font-size:11px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:ti .25s ease,to .25s ease 2.5s forwards;max-width:240px;pointer-events:auto}
.toast.err{border-color:var(--pink-d);border-left-color:var(--pink-d)}
.toast.ok{border-color:var(--blue);border-left-color:var(--blue)}
@keyframes ti{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes to{to{transform:translateX(100%);opacity:0}}

/* Splash */
.splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9998;transition:opacity .4s}
.splash.hide{opacity:0;pointer-events:none}
.sp-logo{font-size:24px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,var(--pink-s),var(--purple),var(--blue-s));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pu 1.5s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.5}50%{opacity:1}}
.sp-bar{width:120px;height:2px;background:var(--card);border-radius:2px;overflow:hidden;margin:14px auto 0}
.sp-bar::after{content:'';display:block;width:30%;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}

/* Responsive */
@media(max-height:768px){.avatar-circle{width:150px;height:150px}.info-area h2{font-size:18px}.app{padding:8px;gap:6px}}
@media(max-width:400px){
  .app{padding:6px;gap:5px}.header{padding:8px 10px;gap:5px}.brand-text h1{font-size:14px}.brand-text p{display:none}.logo{width:30px;height:30px}
  .api-in{width:80px;font-size:9px;padding:4px 6px}.btn{padding:4px 6px;font-size:9px}
  .sidebar{width:36px;border-radius:10px}.sidebar.off{width:36px}.sb-head{padding:6px 3px}.sb-title,.sb-cnt{display:none}.fb-list{padding:3px 2px}.fb-av{width:28px;height:28px}
  .avatar-circle{width:120px;height:120px}.info-area h2{font-size:16px}.info-grid{gap:2px 10px;font-size:10px}.task-chip{padding:3px 7px;font-size:9px}
  .bubble{font-size:10px;padding:6px 10px;max-width:180px}
}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div style="text-align:center"><div class="sp-logo">LOVE CAST</div><div class="sp-bar"></div></div>
</div>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo"></div>
      <div class="brand-text"><h1>LOVE CAST</h1><p>Vũ trụ tình cảm</p></div>
    </div>
    <div class="controls">
      <div class="api-bar">
        <input class="api-in" id="apiKeyInput" type="password" placeholder="Groq API Key...">
        <button class="btn pri" id="apiBtn" style="padding:5px 8px;font-size:9px">Lưu</button>
        <button class="btn dn" id="apiClearBtn" style="padding:5px 8px;font-size:9px" title="Xóa Key">✕</button>
        <div class="api-dot" id="apiDot"></div>
      </div>
      <button class="btn" id="prevBtn" disabled>‹</button>
      <button class="btn pri" id="randomBtn" disabled>⟳</button>
      <button class="btn" id="nextBtn" disabled>›</button>
    </div>
  </header>

  <div class="body-wrap">
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <span class="sb-title">Love</span>
        <span class="sb-cnt" id="castCount">0</span>
        <button class="tog" id="toggleSidebar" title="Thu gọn">◀</button>
      </div>
      <div class="fb-list" id="castList">
        <div style="text-align:center;color:var(--muted);font-size:10px;padding:16px 4px">...</div>
      </div>
    </aside>
    <div class="main" id="mainContent">
      <div style="color:var(--muted);font-size:12px">Đang tải...</div>
    </div>
  </div>
</div>

<div class="toast-c" id="toasts"></div>
<input type="file" id="fileInputInfo" accept=".txt" style="display:none">

<script>
var state={cast:[],activities:[],actions:[],currentIdx:0,groqKey:'',groqReady:false,bossInfo:null,avatarSmall:false};
var $=function(s){return document.querySelector(s);};

function loadApiKey(){var k=localStorage.getItem('groq_api_key');if(k&&k.length>5){state.groqKey=k;$('#apiKeyInput').value=k;return true;}return false;}
function saveApiKey(k){localStorage.setItem('groq_api_key',k);}
function clearApiKey(){localStorage.removeItem('groq_api_key');state.groqKey='';state.groqReady=false;$('#apiKeyInput').value='';$('#apiDot').classList.remove('on');$('#apiBtn').textContent='Lưu';$('#apiBtn').disabled=false;stopAuto();toast('Đã xóa Key','ok');}
function toast(m,t){var e=document.createElement('div');e.className='toast'+(t==='err'?' err':t==='ok'?' ok':'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(function(){e.remove();},2800);}
function pick(a,e){if(!a.length)return'';if(a.length===1)return a[0];var v;do{v=a[Math.floor(Math.random()*a.length)];}while(v===e);return v;}

/* Giờ hiện tại có nghĩa */
function getTimeContext(){
  var h=new Date().getHours(),m=new Date().getMinutes();
  var time=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  var period='';
  if(h>=5&&h<8)period='sáng sớm';
  else if(h>=8&&h<11)period='buổi sáng';
  else if(h>=11&&h<13)period='trưa';
  else if(h>=13&&h<17)period='buổi chiều';
  else if(h>=17&&h<19)period='chiều tối';
  else if(h>=19&&h<22)period='tối';
  else period='đêm khuya';
  return 'Bây giờ là '+time+', '+period+'.';
}

function parseTaskText(t){return t.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length>0;});}
function parseActiveText(t){return t.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length>0;}).map(function(l){var p=l.split('|');return{action:p[0].trim(),location:p[1]?p[1].trim():''};});}
function parseInfoText(t){
  var lines=t.split(/\r?\n/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;});
  if(lines.length>0){var p=lines[0].split('|').map(function(x){return x.trim();});
    return{name:p[0]||'?',birth:p[1]||'—',location:p[2]||'—',school:p[3]||'—',height:p[4]||'—'};}
  return{name:'?',birth:'—',location:'—',school:'—',height:'—'};
}
function parseBossText(t){
  var lines=t.split(/\r?\n/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;});
  var o={name:'Boss',role:'—',note:'—'};
  lines.forEach(function(x){if(x.indexOf('|')>-1){var p=x.split('|');o.name=p[0].trim()||o.name;o.role=p[1]?p[1].trim():o.role;o.note=p[2]?p[2].trim():o.note;}else if(o.name==='Boss')o.name=x;});
  return o;
}

function fetchFile(u){return new Promise(function(r){var x=new XMLHttpRequest();x.open('GET',u,true);x.onload=function(){r(x.status===200||x.status===0?x.responseText:null);};x.onerror=function(){r(null);};x.send();});}

/* === GROQ — AI tự tạo, không prompt cố định === */
async function groqFree(prompt){
  if(!state.groqReady)return null;
  try{
    var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.groqKey},
      body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],max_tokens:50,temperature:1.3})
    });
    if(!r.ok)return null;var d=await r.json();return d.choices&&d.choices[0]?d.choices[0].message.content.trim():null;
  }catch(e){return null;}
}

/* === TỰ ĐỘNG: click vào ai → AI đọc info + task/active + giờ → nói 1 câu === */
var bubbleEl=null,autoCool=false;

async function sayAboutPerson(person){
  if(!state.groqReady||autoCool||!bubbleEl)return;
  autoCool=true;

  bubbleEl.innerHTML='<span class="t"><span>.</span><span>.</span><span>.</span></span>';
  bubbleEl.classList.add('show');

  var info=person.info||{name:'?',birth:'—',location:'—',school:'—',height:'—'};
  var tasks=state.activities.length>0?state.activities.join(', '):'chưa rõ';
  var actives=state.actions.length>0?state.actions.map(function(a){return a.action;}).join(', '):'chưa rõ';

  /* Prompt mở — AI tự quyết định nói gì, chỉ cung cấp data */
  var prompt='Thông tin: '+info.name+', sinh '+info.birth+', quê '+info.location+', học '+info.school+', cao '+info.height+'. '+
    'Nhiệm vụ: '+tasks+'. Active: '+actives+'. '+getTimeContext()+
    ' Viết 1 câu ngắn về người này lúc này. Dưới 20 chữ.';

  var reply=await groqFree(prompt);
  if(reply){
    var clean=reply.split('\n')[0].replace(/[\*\(\)\[\]""'']/g,'').trim();
    if(clean.length>50)clean=clean.substring(0,47)+'...';
    bubbleEl.textContent=clean;
    bubbleEl.classList.add('show');
  }else{
    bubbleEl.classList.remove('show');
  }
  setTimeout(function(){if(bubbleEl)bubbleEl.classList.remove('show');},12000);
  setTimeout(function(){autoCool=false;},8000);
}

/* === LOAD === */
async function autoLoadAll(){
  var r=await Promise.all([fetchFile('./task/boss.txt'),fetchFile('./task/task.txt'),fetchFile('./task/active.txt')]);
  if(r[0])state.bossInfo=parseBossText(r[0]);
  if(r[1])state.activities=parseTaskText(r[1]);
  if(r[2])state.actions=parseActiveText(r[2]);
  var l=[];if(r[0])l.push('boss');if(r[1])l.push('task');if(r[2])l.push('active');
  if(l.length)toast('Đã tải: '+l.join(', '),'ok');
  if(state.cast.length>0)renderProfile();
  startTimers();
}

function autoScanImages(){
  var found=0,done=0,total=60;
  for(var i=1;i<=total;i++){(function(idx){
    var id=String(idx).padStart(2,'0');var img=new Image();
    img.onload=function(){state.cast.push({id:id,imgSrc:'./source/'+id+'.jpg'});found++;done++;chk();};
    img.onerror=function(){done++;chk();};img.src='./source/'+id+'.jpg';
  })(i);}
  function chk(){if(done>=total){
    if(found>0){state.cast.sort(function(a,b){return parseInt(a.id)-parseInt(b.id);});renderCastList();
      $('#prevBtn').disabled=false;$('#nextBtn').disabled=false;$('#randomBtn').disabled=false;toast(found+' ảnh','ok');
      var i01=state.cast.findIndex(function(c){return c.id==='01';});if(i01>-1){state.currentIdx=i01;renderCastList();autoLoadInfo(state.cast[i01]);}
      if(state.bossInfo||state.activities.length)renderProfile();
    }else{toast('Không tìm thấy ảnh!','err');}
  }}
}

async function autoLoadInfo(p){var t=await fetchFile('./Pro/'+p.id+'.txt');if(t){p.info=parseInfoText(t);if(state.cast[state.currentIdx]&&state.cast[state.currentIdx].id===p.id)renderProfile();}}

function renderCastList(){
  var el=$('#castList');el.innerHTML='';
  state.cast.forEach(function(p,i){
    var d=document.createElement('div');d.className='fb-i'+(i===state.currentIdx?' on':'');
    d.innerHTML='<div class="fb-av"><img src="'+p.imgSrc+'" alt="'+p.id+'"></div><div class="fb-nm">'+p.id+'</div>';
    d.addEventListener('click',function(){state.currentIdx=i;renderCastList();renderProfile();if(!p.info)autoLoadInfo(p);resetTimers();sayAboutPerson(p);});
    el.appendChild(d);
  });
  $('#castCount').textContent=state.cast.length;
}

/* === RENDER — toàn trang, avatar tròn giữa === */
function renderProfile(){
  var main=$('#mainContent');var p=state.cast[state.currentIdx);
  if(!p){main.innerHTML='<div style="color:var(--muted);font-size:12px">Chọn người</div>';return;}
  var info=p.info||{name:'ID '+p.id,birth:'—',location:'—',school:'—',height:'—'};
  var taskAct='—',activeDet='—';
  if(state.activities.length>0)taskAct=pick(state.activities);
  if(state.actions.length>0){var a=pick(state.actions);activeDet=a.action+(a.location?' '+a.location:'');}

  var avSize=state.avatarSmall?'120px':'180px';

  main.innerHTML=
    '<div class="avatar-wrap">'+
      '<div class="avatar-circle" style="width:'+avSize+';height:'+avSize+'">'+
        '<img src="'+p.imgSrc+'" alt="'+info.name+'">'+
      '</div>'+
      '<button class="col-btn" id="colBtn" title="Thu gọn">'+(state.avatarSmall?'⊕':'⊖')+'</button>'+
      '<div class="bubble" id="lifeBubble"></div>'+
    '</div>'+
    '<div class="info-area">'+
      '<h2>'+info.name+'</h2>'+
      '<div class="sub">'+info.birth+'</div>'+
      '<div class="info-grid">'+
        '<div><div class="l">Nơi sinh</div><div class="v">'+info.location+'</div></div>'+
        '<div><div class="l">Chiều cao</div><div class="v">'+info.height+'</div></div>'+
        '<div><div class="l">Học vấn</div><div class="v" style="grid-column:span 2">'+info.school+'</div></div>'+
      '</div>'+
      '<div class="task-row">'+
        '<div class="task-chip"><span class="tl">Nhiệm vụ</span><span class="tv" id="taskVal">'+taskAct+'</span></div>'+
        '<div class="task-chip"><span class="tl">Active</span><span class="tv" id="activeVal">'+activeDet+'</span></div>'+
      '</div>'+
    '</div>';

  bubbleEl=$('#lifeBubble');

  /* Nút thu gọn avatar */
  $('#colBtn').addEventListener('click',function(){
    state.avatarSmall=!state.avatarSmall;
    renderProfile();
  });
}

function nextPerson(){if(!state.cast.length)return;state.currentIdx=(state.currentIdx+1)%state.cast.length;var p=state.cast[state.currentIdx];renderCastList();renderProfile();if(!p.info)autoLoadInfo(p);resetTimers();sayAboutPerson(p);}
function prevPerson(){if(!state.cast.length)return;state.currentIdx=(state.currentIdx-1+state.cast.length)%state.cast.length;var p=state.cast[state.currentIdx];renderCastList();renderProfile();if(!p.info)autoLoadInfo(p);resetTimers();sayAboutPerson(p);}
function randomPerson(){if(state.cast.length<2)return;var n;do{n=Math.floor(Math.random()*state.cast.length);}while(n===state.currentIdx);state.currentIdx=n;var p=state.cast[state.currentIdx];renderCastList();renderProfile();if(!p.info)autoLoadInfo(p);resetTimers();sayAboutPerson(p);}
function toggleSidebar(){var sb=$('#sidebar');sb.classList.toggle('off');$('#toggleSidebar').textContent=sb.classList.contains('off')?'▶':'◀';}

/* Timers chỉ cho task/active */
var taskInt=null,activeInt=null;
function startTimers(){stopTimers();if(!state.activities.length)return;
  activeInt=setInterval(function(){if(!state.actions.length)return;var a=pick(state.actions);var el=$('#activeVal');if(el)el.textContent=a.action+(a.location?' '+a.location:'');},60000);
  taskInt=setInterval(function(){if(!state.activities.length)return;var el=$('#taskVal');if(el)el.textContent=pick(state.activities,el.textContent);},1200000);
}
function stopTimers(){if(taskInt){clearInterval(taskInt);taskInt=null;}if(activeInt){clearInterval(activeInt);activeInt=null;}}
function resetTimers(){startTimers();}
/* Dummy cho auto (đã bỏ) */
function stopAuto(){}

/* API Key */
function handleApiKey(){
  var k=$('#apiKeyInput').value.trim();if(!k){toast('Nhập Key','err');return;}
  state.groqKey=k;$('#apiBtn').textContent='...';$('#apiBtn').disabled=true;
  fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:'ok'}],max_tokens:2})})
  .then(function(r){if(r.ok){state.groqReady=true;saveApiKey(k);$('#apiDot').classList.add('on');$('#apiBtn').textContent='Đã lưu';toast('Sẵn sàng!','ok');}else throw new Error(r.status);})
  .catch(function(e){state.groqReady=false;$('#apiBtn').textContent='Lưu';$('#apiBtn').disabled=false;toast('Lỗi: '+e.message,'err');});
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(!state.cast.length)return;
  if(e.code==='Space'){e.preventDefault();randomPerson();}
  else if(e.code==='ArrowLeft')prevPerson();
  else if(e.code==='ArrowRight')nextPerson();
});

function init(){
  $('#toggleSidebar').addEventListener('click',toggleSidebar);
  $('#prevBtn').addEventListener('click',prevPerson);
  $('#nextBtn').addEventListener('click',nextPerson);
  $('#randomBtn').addEventListener('click',randomPerson);
  $('#apiBtn').addEventListener('click',handleApiKey);
  $('#apiClearBtn').addEventListener('click',clearApiKey);
  $('#apiKeyInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();handleApiKey();}});
  $('#fileInputInfo').addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(ev){var p=state.cast[state.currentIdx];if(p){p.info=parseInfoText(ev.target.result);toast('Đã tải '+f.name,'ok');renderProfile();}};
    r.readAsText(f);e.target.value='';
  });
  setTimeout(function(){$('#splash').classList.add('hide');setTimeout(function(){$('#splash').remove();},400);},500);
  autoScanImages();
  autoLoadAll();
  if(loadApiKey()){
    fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.groqKey},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:'ok'}],max_tokens:2})})
    .then(function(r){if(r.ok){state.groqReady=true;$('#apiDot').classList.add('on');$('#apiBtn').textContent='Đã lưu';$('#apiBtn').disabled=true;}else clearApiKey();})
    .catch(function(){clearApiKey();});
  }
}
init();
</script>
</body>
</html>
