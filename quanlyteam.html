<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VỢ MANAGER</title>
<style>
:root{
  --bg-deep:#0c0908;--bg:#14100d;--card:#1c1714;--card-2:#241c17;
  --border:#332820;--border-soft:#2a221c;
  --amber:#d4a574;--amber-soft:#e8c8a0;--amber-deep:#8a6440;
  --red:#c64a3a;--green:#7a9a5a;--text:#ede0cc;--muted:#8a7868;
  --shadow:0 10px 30px rgba(0,0,0,.4);--mxw:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-deep);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body{background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(212,165,116,.08),transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(198,74,58,.06),transparent 60%),linear-gradient(180deg,var(--bg-deep),var(--bg));background-attachment:fixed;padding:18px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 1px 1px,rgba(212,165,116,.04) 1px,transparent 0);background-size:24px 24px}
.app{max-width:var(--mxw);margin:0 auto;position:relative;z-index:1;animation:appIn .7s cubic-bezier(.16,1,.3,1)}
@keyframes appIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== HEADER ===== */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:14px;margin-bottom:14px;box-shadow:var(--shadow);flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--amber),var(--amber-deep));display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--bg-deep);letter-spacing:-1px;box-shadow:0 4px 14px rgba(212,165,116,.3);position:relative;overflow:hidden}
.logo::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);animation:shine 4s infinite}
@keyframes shine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.brand-text h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.brand-text p{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 13px;border-radius:9px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--amber),var(--amber-deep));border-color:var(--amber);color:var(--bg-deep);font-weight:800}
.btn.primary:hover{box-shadow:0 6px 18px rgba(212,165,116,.35)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.mode-pill{font-size:9.5px;font-weight:800;letter-spacing:1.5px;padding:4px 9px;border-radius:20px;text-transform:uppercase;transition:all .3s}
.mode-pill.auto{background:rgba(122,154,90,.15);color:var(--green);border:1px solid rgba(122,154,90,.35)}
.mode-pill.manual{background:rgba(198,74,58,.15);color:var(--red);border:1px solid rgba(198,74,58,.35)}
.key-btn{font-size:10px!important;padding:5px 9px!important;border-radius:7px!important;opacity:.6;transition:all .2s}
.key-btn:hover{opacity:1}
.key-btn.ok{border-color:var(--green);color:var(--green);opacity:.8}

/* ===== LAYOUT ===== */
.layout{display:flex;gap:14px;min-height:calc(100vh - 110px)}

/* ===== SIDEBAR ===== */
.sidebar{width:170px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:width .3s,opacity .3s,padding .3s;overflow:hidden}
.sidebar.collapsed{width:48px;padding:12px 8px}
.sidebar.collapsed .sidebar-head-text,.sidebar.collapsed .fb-story-info,.sidebar.collapsed .sidebar-title,.sidebar.collapsed .sidebar-count{display:none}
.sidebar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border-soft)}
.sidebar-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.sidebar-count{font-size:10px;color:var(--amber);font-weight:700;background:rgba(212,165,116,.1);padding:2px 7px;border-radius:6px}
.toggle-sidebar{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 4px;border-radius:4px;transition:color .2s;line-height:1;flex-shrink:0}
.toggle-sidebar:hover{color:var(--amber)}

.sb-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;flex:1}
.sb-list::-webkit-scrollbar{width:0}
.sb-item{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:10px;cursor:pointer;transition:all .2s;flex-shrink:0}
.sb-item:hover{background:var(--card-2)}
.sb-item.active{background:var(--card-2)}
.sb-av{width:36px;height:36px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--amber),var(--amber-deep));flex-shrink:0;transition:transform .2s}
.sb-item:hover .sb-av{transform:scale(1.06)}
.sb-av-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--card)}
.sb-av-inner img{width:100%;height:100%;object-fit:cover;display:block}
.sb-item.active .sb-av{box-shadow:0 0 10px rgba(212,165,116,.4)}
.sb-info{flex:1;min-width:0}
.sb-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.active .sb-name{color:var(--amber)}
.sb-sub{font-size:9.5px;color:var(--muted);margin-top:1px}

/* ===== MAIN ===== */
.main{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:500px}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);margin-bottom:12px;letter-spacing:.4px;flex-wrap:wrap}
.breadcrumb .sep{opacity:.4}
.breadcrumb .cur{color:var(--amber);font-weight:700}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:4px;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ===== PROFILE + BUBBLE GẮN ẢNH ===== */
.profile-zone{display:grid;grid-template-columns:200px 1fr;gap:16px;margin-bottom:14px;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:768px){.profile-zone{grid-template-columns:1fr}}

.img-bubble-wrap{position:relative}
.profile-img{width:200px;height:260px;border-radius:12px;background:linear-gradient(135deg,#2a221c,#1a1512);overflow:hidden;position:relative;border:1px solid var(--border);box-shadow:0 8px 20px rgba(0,0,0,.4)}
@media(max-width:768px){.profile-img{width:150px;height:195px;margin:0 auto}}
.profile-img img{width:100%;height:100%;object-fit:cover;display:block;animation:imgIn .5s ease}
@keyframes imgIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}
.profile-img .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);padding:3px 7px;border-radius:5px;font-size:9px;font-weight:700;color:var(--amber);letter-spacing:.8px;border:1px solid rgba(212,165,116,.3)}

/* ===== BUBBLE NỔI NGAY ẢNH ===== */
.wife-bubble{position:absolute;bottom:-8px;right:-12px;width:calc(100% + 80px);max-width:320px;background:linear-gradient(135deg,var(--card-2),var(--card));border:1.5px solid var(--amber);border-radius:16px;padding:12px 16px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 20px rgba(212,165,116,.1);animation:bubblePop .4s cubic-bezier(.16,1,.3,1)}
@keyframes bubblePop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}
.wife-bubble::before{content:'';position:absolute;bottom:14px;left:-10px;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:10px solid var(--amber)}
.wife-bubble::after{content:'';position:absolute;bottom:15px;left:-8px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:9px solid var(--card-2)}
.wb-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wb-av{width:26px;height:26px;border-radius:50%;overflow:hidden;border:1.5px solid var(--amber);flex-shrink:0}
.wb-av img{width:100%;height:100%;object-fit:cover}
.wb-name{font-size:10px;font-weight:800;color:var(--amber);letter-spacing:1px;text-transform:uppercase}
.wb-time{margin-left:auto;font-size:9px;color:var(--muted);opacity:.6}
.wb-text{font-size:13.5px;line-height:1.6;color:var(--text)}
.wb-text .wb-cur{display:inline-block;width:2px;height:13px;background:var(--amber);margin-left:1px;vertical-align:text-bottom;animation:cursorBlink .5s step-end infinite}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

@media(max-width:768px){
  .wife-bubble{position:relative;bottom:auto;right:auto;width:100%;max-width:none;margin-top:10px}
  .wife-bubble::before,.wife-bubble::after{display:none}
}
@media(max-width:500px){
  .profile-zone{grid-template-columns:1fr}
  .wife-bubble{max-width:none;width:100%}
}

/* ===== THÔNG TIN ===== */
.profile-info{display:flex;flex-direction:column;gap:3px}
.profile-info h2{font-size:24px;font-weight:800;letter-spacing:-.4px}
@media(max-width:768px){.profile-info h2{text-align:center}}
.profile-info .role{font-size:12px;color:var(--amber);margin-bottom:10px;font-weight:600}
@media(max-width:768px){.profile-info .role{text-align:center}}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:11.5px}
.info-grid .lbl{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.8px}
.info-grid .val{color:var(--text);font-weight:600;margin-bottom:3px}

/* ===== KHUNG CHAT CHỈ CHO CHỒNG ===== */
.chat-box{flex:1;display:flex;flex-direction:column;border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;background:var(--bg-deep);min-height:180px}
.chat-log{flex:1;padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.chat-log::-webkit-scrollbar{width:4px}
.chat-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg{display:flex;gap:8px;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chat-msg.me{flex-direction:row-reverse}
.cm-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--muted);color:var(--muted);background:var(--card-2)}
.chat-msg.me .cm-av{border-color:var(--amber);color:var(--amber);background:rgba(212,165,116,.1)}
.cm-bubble{max-width:70%;padding:8px 13px;border-radius:12px;font-size:13px;line-height:1.55}
.chat-msg:not(.me) .cm-bubble{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}
.chat-msg.me .cm-bubble{background:rgba(212,165,116,.12);border:1px solid rgba(212,165,116,.2);border-top-right-radius:4px;color:var(--amber-soft)}
.cm-time{font-size:8.5px;color:var(--muted);opacity:.5;margin-top:2px}
.chat-msg.me .cm-time{text-align:right}
.chat-empty{text-align:center;color:var(--muted);font-size:12px;padding:30px 10px;opacity:.6}
.chat-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:0 16px}
.chat-input-bar{display:flex;gap:8px;padding:10px 16px 12px;background:var(--card);align-items:center}
.chat-input{flex:1;padding:9px 13px;border-radius:9px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text);font-family:inherit;font-size:12.5px;outline:none;transition:border-color .2s}
.chat-input:focus{border-color:var(--amber)}
.chat-input::placeholder{color:var(--muted);opacity:.4}
.chat-send{width:36px;height:36px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--amber),var(--amber-deep));color:var(--bg-deep);font-size:16px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:all .2s;font-weight:700}
.chat-send:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(212,165,116,.3)}
.chat-send:disabled{opacity:.3;cursor:not-allowed;transform:none}

/* ===== TOAST ===== */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--amber);border-left:4px solid var(--amber);padding:10px 14px;border-radius:8px;color:var(--text);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;max-width:280px;pointer-events:auto}
.toast.err{border-color:var(--red);border-left-color:var(--red)}
.toast.ok{border-color:var(--green);border-left-color:var(--green)}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(120%);opacity:0}}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;background:var(--bg-deep);display:grid;place-items:center;z-index:9998;transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo{font-size:28px;font-weight:900;letter-spacing:4px;color:var(--amber);margin-bottom:12px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.splash-bar{width:180px;height:2px;background:var(--card);border-radius:2px;overflow:hidden}
.splash-bar::after{content:'';display:block;width:30%;height:100%;background:var(--amber);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}

.empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:40px 20px}
.empty .icon{font-size:48px;margin-bottom:10px;opacity:.4}
.empty h3{font-size:15px;color:var(--text);margin-bottom:5px}
.empty p{font-size:12px;line-height:1.6}

/* ===== KEY MODAL ===== */
.key-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:950;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}
.key-overlay.show{opacity:1;pointer-events:auto}
.key-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);width:min(420px,90vw);background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--amber);border-radius:16px;padding:24px 22px 20px;z-index:951;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.16,1,.3,1);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.key-modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.km-icon{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--amber),var(--amber-deep));display:grid;place-items:center;font-size:22px;color:var(--bg-deep);margin-bottom:12px}
.km h2{font-size:17px;font-weight:800;margin-bottom:5px}
.km .desc{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.km .desc a{color:var(--amber);text-decoration:underline}
.km-saved{display:none;align-items:center;gap:8px;padding:9px 11px;background:rgba(122,154,90,.1);border:1px solid rgba(122,154,90,.25);border-radius:9px;margin-bottom:12px;font-size:11px;color:var(--green);font-weight:600}
.km-saved .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.km-saved .chg{margin-left:auto;color:var(--amber);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;font-size:10.5px}
.km-iwrap{position:relative;margin-bottom:5px}
.km-input{width:100%;padding:10px 38px 10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text);font-family:'Courier New',monospace;font-size:12.5px;outline:none;transition:all .2s}
.km-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(212,165,116,.12)}
.km-input::placeholder{color:var(--muted);opacity:.4;font-family:'Segoe UI',sans-serif}
.km-eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:3px}
.km-eye:hover{color:var(--amber)}
.km-hint{font-size:9.5px;color:var(--muted);margin-bottom:12px}
.km-hint .w{color:var(--red)}
.km-acts{display:flex;gap:8px;justify-content:flex-end}
.km-acts .btn{min-width:80px;justify-content:center;font-size:11.5px}
</style>
</head>
<body>

<div class="splash" id="splash"><div style="text-align:center"><div class="splash-logo">VỢ MANAGER</div><div class="splash-bar"></div></div></div>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">♡</div>
      <div class="brand-text"><h1>VỢ MANAGER</h1><p>Quản lý vợ</p></div>
    </div>
    <div class="controls">
      <button class="btn ghost key-btn" id="keyBtn" title="Groq API Key">🔑</button>
      <span class="mode-pill auto" id="modePill">Tự động</span>
      <button class="btn ghost" id="modeBtn" disabled><span id="modeBtnText">⋮⋮</span></button>
      <button class="btn" id="prevBtn" disabled>‹</button>
      <button class="btn primary" id="randomBtn" disabled">⟳</button>
      <button class="btn" id="nextBtn" disabled>›</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-head-text"><span class="sidebar-title">Vợ</span> <span class="sidebar-count" id="castCount">0</span></span>
        <button class="toggle-sidebar" id="toggleSB" title="Thu nhỏ">◁</button>
      </div>
      <div class="sb-list" id="castList">
        <div style="text-align:center;color:var(--muted);font-size:12px;padding:18px 4px">Đang quét...</div>
      </div>
    </aside>

    <main class="main" id="mainContent">
      <div class="empty" id="emptyState">
        <div class="icon">♡</div>
        <h3>Đang chờ dữ liệu</h3>
        <p>Quét ảnh <code>source/</code> · Thông tin <code>Pro/</code> · Hoạt động <code>task/</code></p>
      </div>
    </main>
  </div>
</div>

<!-- Key modal -->
<div class="key-overlay" id="keyOverlay"></div>
<div class="key-modal km" id="keyModal">
  <div class="km-icon">🔑</div>
  <h2>Groq API Key</h2>
  <p class="desc">Để vợ nói chuyện chuẩn hơn. Lấy miễn phí tại <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></p>
  <div class="km-saved" id="kmSaved"><span class="dot"></span><span id="kmSavedTxt"></span><button class="chg" id="kmChg">Đổi</button></div>
  <div class="km-iwrap"><input type="password" class="km-input" id="kmInput" placeholder="gsk_xxxxx..." autocomplete="off" spellcheck="false"><button class="km-eye" id="kmEye">◉</button></div>
  <div class="km-hint"><span class="w">⚠</span> Chỉ lưu trên trình duyệt này.</div>
  <div class="km-acts"><button class="btn ghost" id="kmCancel">Hủy</button><button class="btn primary" id="kmSave">Lưu</button></div>
</div>

<div class="toast-container" id="toasts"></div>
<input type="file" id="fileInputInfo" accept=".txt" style="display:none">

<script>
/* ===== STATE ===== */
var S={cast:[],activities:[],actions:[],currentIdx:0,mode:'auto',bossInfo:'',progressTimer:null};
var GROQ_URL='https://api.groq.com/openai/v1/chat/completions';
var SK='vfm_gk';var groqCool=false;var chatHist=[];var kmCb=null;
var autoSayTmo=null;var actStart=0,actInt=null,taskInt=null,activeInt=null;

var $=function(s){return document.querySelector(s)};
function toast(m,t){var e=document.createElement('div'),c='toast ';if(t==='err')c+='err';else if(t==='ok')c+='ok';e.className=c;e.textContent=m;$('#toasts').appendChild(e);setTimeout(function(){e.remove()},3000)}
function pick(a,ex){if(!a.length)return'';if(a.length===1)return a[0];var v;do{v=a[Math.floor(Math.random()*a.length)]}while(v===ex);return v}
function fmtT(s){var m=Math.floor(s/60),ss=s%60;return(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss}
function now(){var d=new Date();return(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}

/* ===== KEY ===== */
function gK(){try{return localStorage.getItem(SK)||''}catch(e){return''}}
function sK(k){try{localStorage.setItem(SK,k)}catch(e){}}
function dK(){try{localStorage.removeItem(SK)}catch(e){}}
function hK(){return gK().trim().length>10}
function mK(k){return k.length<=12?'****':k.substring(0,7)+'****'+k.substring(k.length-4)}

function showKM(cb){
  kmCb=cb;var s=gK().trim(),sv=$('#kmSaved'),inp=$('#kmInput');
  if(s.length>10){sv.style.display='flex';$('#kmSavedTxt').textContent=mK(s);inp.value=''}else{sv.style.display='none';inp.value=''}
  $('#keyOverlay').classList.add('show');$('#keyModal').classList.add('show');setTimeout(function(){inp.focus()},350);
}
function hideKM(){$('#keyOverlay').classList.remove('show');$('#keyModal').classList.remove('show');kmCb=null}
function saveKM(){
  var v=$('#kmInput').value.trim();
  if(!v.length){var s=gK().trim();if(s.length>10)v=s;else{toast('Nhập Key','err');return}}
  if(!v.startsWith('gsk_')){toast('Bắt đầu bằng "gsk_"','err');return}
  if(v.length<20){toast('Key quá ngắn','err');return}
  sK(v);toast('Đã lưu Key!','ok');updKB();var cb=kmCb;hideKM();if(cb)cb();
}
function updKB(){var b=$('#keyBtn');if(hK()){b.classList.add('ok');b.title='Key đã lưu'}else{b.classList.remove('ok');b.title='Chưa có Key'}}

/* ===== GROQ ===== */
async function groqChat(userMsg,hist,isReply){
  var key=gK().trim();if(!key||groqCool)return null;
  groqCool=true;setTimeout(function(){groqCool=false},5000);
  var ctrl=new AbortController(),tmo=setTimeout(function(){ctrl.abort()},7000);
  var wName=getWName(),bInfo=S.bossInfo;
  var sys='Bạn là "'+wName+'", vợ Việt Nam nói với chồng là "anh", tự xưng "em".'+(bInfo?' Về chồng: '+bInfo:'')+' Nói CỰC NGẮN: đúng 1 câu, tối đa 12 chữ. Đời thường, gọn, tự nhiên. Không emoji, không ngoặc kép, không giải thích.';
  if(isReply)sys+=' Trả lời ngắn gọn câu anh vừa nói.';

  try{
    var msgs=[{role:'system',content:sys}];
    for(var i=Math.max(0,hist.length-8);i<hist.length;i++)msgs.push(hist[i]);
    msgs.push({role:'user',content:userMsg});
    var r=await fetch(GROQ_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'llama-3.1-8b-instant',messages:msgs,max_tokens:50,temperature:0.9}),signal:ctrl.signal});
    clearTimeout(tmo);var d=await r.json();
    if(d.error){var m=(d.error.message||'').toLowerCase();if(m.indexOf('invalid')>-1||m.indexOf('unauthorized')>-1){dK();updKB();toast('Key lỗi','err')}return null}
    if(d.choices&&d.choices[0]){var tx=d.choices[0].message.content.trim();
      if((tx[0]==='"'&&tx[tx.length-1]==='"')||(tx[0]==='\u201C'&&tx[tx.length-1]==='\u201D'))tx=tx.slice(1,-1);
      if(tx.length>2&&tx.length<60)return tx}
  }catch(e){clearTimeout(tmo)}
  return null;
}

};
function fbFromActive(text){var t=text.toLowerCase();for(var k in fbMap){if(t.indexOf(k)>-1)return fbMap[k]}return pick(['Anh ơi em đây.','Em bận chút anh.','Anh ra đây đi.','Nhớ anh quá.'],null)}
function fbReply(){return pick(['Được em ơi.','Anh đây rồi.','Để anh làm.','Ok em.','Anh nhớ em.','Xin lỗi em.','Em ngoan nha.','Anh đi ngay.','Anh mua cho.','Đợi anh nhé.'],null)}

/* ===== HELPERS ===== */
function getWName(){var p=S.cast[S.currentIdx];if(!p)return'Vợ';return(p.info&&p.info.name!=='Chưa có thông tin')?p.info.name:('Vợ #'+p.id)}
function getWImg(){var p=S.cast[S.currentIdx];return p?p.imgSrc:''}

/* ===== BUBBLE TRÊN ẢNH ===== */
var bubbleTyping=false;
function showBubble(text,animate){
  var el=$('#wifeBubble');if(!el)return;
  if(animate)el.style.animation='none',el.offsetHeight,el.style.animation='bubblePop .4s cubic-bezier(.16,1,.3,1)';
  $('#wbName').textContent=getWName();
  $('#wbTime').textContent=now();
  $('#wbText').textContent=text;
}
function showBubbleTyping(){
  if(bubbleTyping)return;bubbleTyping=true;
  var el=$('#wifeBubble');if(!el){bubbleTyping=false;return}
  el.style.animation='none',el.offsetHeight,el.style.animation='bubblePop .4s cubic-bezier(.16,1,.3,1)';
  $('#wbName').textContent=getWName();
  $('#wbTime').textContent=now();
  $('#wbText').innerHTML='<span class="wb-cur"></span>';
}
function typeBubble(text,cb){
  var el=$('#wbText');if(!el){if(cb)cb();return}
  var i=0;
  function next(){if(i<text.length){el.innerHTML=text.substring(0,i+1)+'<span class="wb-cur"></span>';i++;setTimeout(next,30+Math.random()*20)}else{el.textContent=text;bubbleTyping=false;if(cb)cb()}}
  next();
}

/* ===== WIFE TỰ NÓI (DỰA ACTIVE) ===== */
async function wifeSay(){
  if(!S.cast.length||bubbleTyping)return;
  var act='';
  if(S.actions.length>0){var a=pick(S.actions);act=a.action;if(a.location)act+=' '+a.location}
  if(!act)act='làm việc';

  showBubbleTyping();
  var prompt=getWName()+' đang '+act+'. Nói 1 câu ngắn với chồng.';
  var msg=await groqChat(prompt,chatHist,false);
  if(!msg)msg=fbFromActive(act);
  typeBubble(msg);
  chatHist.push({role:'user',content:prompt},{role:'assistant',content:msg});
}

/* ===== CHAT LOG (CHỈ CHO CHỒNG) ===== */
function addChatMsg(text,isMe){
  var log=$('#chatLog');if(!log)return;
  var empty=log.querySelector('.chat-empty');if(empty)empty.remove();
  var row=document.createElement('div');
  row.className='chat-msg'+(isMe?' me':'');
  row.innerHTML='<div class="cm-av">'+(isMe?'♂':'♡')+'</div><div><div class="cm-bubble">'+text+'</div><div class="cm-time">'+now()+'</div></div>';
  log.appendChild(row);log.scrollTop=log.scrollHeight;
}
function addChatTyping(){
  var log=$('#chatLog');if(!log)return;
  var row=document.createElement('div');row.className='chat-msg';row.id='chatTyping';
  row.innerHTML='<div class="cm-av">♡</div><div><div class="cm-bubble" style="color:var(--muted)">...</div></div>';
  log.appendChild(row);log.scrollTop=log.scrollHeight;
}
function removeChatTyping(){var r=$('#chatTyping');if(r)r.remove()}

async function husbandSend(text){
  if(!text.trim()||!S.cast.length)return;
  text=text.trim();
  addChatMsg(text,true);
  chatHist.push({role:'user',content:text});

  /* Vợ trả lời trong chat log */
  addChatTyping();
  var msg=await groqChat(text,chatHist,true);
  if(!msg)msg=fbReply();
  removeChatTyping();
  addChatMsg(msg,false);
  chatHist.push({role:'assistant',content:msg});
}

/* ===== PARSE ===== */
function parseTask(t){return t.split(/\r?\n/).map(function(l){return l.trim()}).filter(function(l){return l.length>0})}
function parseActive(t){return t.split(/\r?\n/).map(function(l){return l.trim()}).filter(function(l){return l.length>0}).map(function(l){var p=l.split('|');return{action:p[0].trim(),location:p[1]?p[1].trim():''}})}
function parseInfo(t){var ls=t.split(/\r?\n/).map(function(l){return l.trim()}).filter(function(l){return l.length>0});if(ls.length>0){var p=ls[0].split('|').map(function(s){return s.trim()});return{name:p[0]||'Chưa có thông tin',birth:p[1]||'—',location:p[2]||'—',school:p[3]||'—',height:p[4]||'—'}}return{name:'Chưa có thông tin',birth:'—',location:'—',school:'—',height:'—'}}

/* ===== FETCH ===== */
function fF(u){return new Promise(function(r){var x=new XMLHttpRequest();x.open('GET',u,true);x.onload=function(){r(x.status===200||x.status===0?x.responseText:null)};x.onerror=function(){r(null)};x.send()})}

async function loadTasks(){
  var t=await fF('./task/task.txt'),a=await fF('./task/active.txt'),b=await fF('./task/boss.txt');
  if(t)S.activities=parseTask(t);if(a)S.actions=parseActive(a);
  if(b){S.bossInfo=b.split(/\r?\n/).map(function(l){return l.trim()}).filter(function(l){return l.length>0}).join('. ');if(S.bossInfo)toast('Đã tải boss.txt!','ok')}
  if(S.activities.length>0&&S.actions.length>0){toast('Đã tải task + active','ok');if(S.cast.length>0)renderProfile();startTimers()}
}

/* ===== SCAN ===== */
function scan(){
  var found=0,scanned=0,total=60;
  for(var i=1;i<=total;i++){(function(idx){
    var id=String(idx).padStart(2,'0'),img=new Image();
    img.onload=function(){S.cast.push({id:id,imgSrc:'./source/'+id+'.jpg'});found++;scanned++;chk(found,scanned,total)};
    img.onerror=function(){scanned++;chk(found,scanned,total)};
    img.src='./source/'+id+'.jpg';
  })(i)}
  function chk(f,s,t){
    if(s>=t){
      if(f>0){
        S.cast.sort(function(a,b){return parseInt(a.id)-parseInt(b.id)});
        renderList();S.currentIdx=0;renderProfile();autoLoadInfo(S.cast[0]);
        toast('Tìm thấy '+f+' ảnh!','ok');
        /* Vợ nói câu đầu sau 6s */
        setTimeout(function(){if(S.cast.length)wifeSay()},6000);
        schedSay();
      }else{
        $('#castList').innerHTML='<div style="text-align:center;color:var(--red);font-size:12px;padding:18px 4px">Không có ảnh!</div>';
        toast('Không tìm thấy ảnh!','err');
      }
    }
  }
}

function schedSay(){if(autoSayTmo)clearTimeout(autoSayTmo);autoSayTmo=setTimeout(function(){wifeSay();schedSay()},40000+Math.random()*50000)}

/* ===== LOAD INFO ===== */
async function autoLoadInfo(p){var t=await fF('./Pro/'+p.id+'.txt');if(t){p.info=parseInfo(t);if(S.cast[S.currentIdx]&&S.cast[S.currentIdx].id===p.id)renderProfile()}}
function handleInfoLoad(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var p=S.cast[S.currentIdx];if(p){p.info=parseInfo(ev.target.result);toast('Đã tải '+f.name,'ok');renderProfile()}};r.readAsText(f);e.target.value=''}

/* ===== RENDER LIST ===== */
function renderList(){
  var list=$('#castList');list.innerHTML='';
  S.cast.forEach(function(p,idx){
    var item=document.createElement('div');item.className='sb-item'+(idx===S.currentIdx?' active':'');
    var dn=(p.info&&p.info.name!=='Chưa có thông tin')?p.info.name:('Vợ #'+p.id);
    item.innerHTML='<div class="sb-av"><div class="sb-av-inner"><img src="'+p.imgSrc+'" alt="'+p.id+'"></div></div><div class="sb-info"><div class="sb-name">'+dn+'</div><div class="sb-sub">Xem</div></div>';
    item.addEventListener('click',function(){S.currentIdx=idx;chatHist=[];renderProfile();renderList();if(!p.info)autoLoadInfo(p);resetT()});
    list.appendChild(item);
  });
  $('#castCount').textContent=S.cast.length;
}

/* ===== RENDER PROFILE ===== */
function renderProfile(){
  var main=$('#mainContent'),p=S.cast[S.currentIdx];
  if(!p){main.innerHTML='<div class="empty"><div class="icon">♡</div><h3>Chưa có dữ liệu</h3></div>';return}
  var info=p.info||{name:'Chưa có thông tin',birth:'—',location:'—',school:'—',height:'—'};

  main.innerHTML=
    '<div class="breadcrumb"><span><span class="live-dot"></span>THEO DÕI</span><span class="sep">/</span><span>Gia đình</span><span class="sep">/</span><span class="cur">'+info.name+'</span></div>'+
    '<div class="profile-zone">'+
      '<div class="img-bubble-wrap">'+
        '<div class="profile-img"><img src="'+p.imgSrc+'" alt="'+p.id+'"><div class="badge">#'+p.id+'</div></div>'+
        '<div class="wife-bubble" id="wifeBubble">'+
          '<div class="wb-top"><div class="wb-av"><img src="'+p.imgSrc+'" alt=""></div><span class="wb-name" id="wbName">'+info.name+'</span><span class="wb-time" id="wbTime">'+now()+'</span></div>'+
          '<div class="wb-text" id="wbText">...</div>'+
        '</div>'+
      '</div>'+
      '<div class="profile-info"><h2>'+info.name+'</h2><div class="role">'+info.birth+'</div>'+
        '<div class="info-grid"><div><div class="lbl">Nơi sinh</div><div class="val">'+info.location+'</div></div><div><div class="lbl">Chiều cao</div><div class="val">'+info.height+'</div></div><div><div class="lbl">Học vấn</div><div class="val" style="grid-column:span 2">'+info.school+'</div></div></div>'+
      '</div>'+
    '</div>'+
    '<div class="chat-box">'+
      '<div class="chat-log" id="chatLog"><div class="chat-empty">Nhắn tin cho vợ ở đây...</div></div>'+
      '<div class="chat-divider"></div>'+
      '<div class="chat-input-bar"><input class="chat-input" id="chatInput" placeholder="Nhắn cho vợ..." maxlength="100"><button class="chat-send" id="chatSend">➤</button></div>'+
    '</div>';

  /* Chat events */
  var inp=$('#chatInput'),send=$('#chatSend');
  function doSend(){var v=inp.value.trim();if(!v)return;inp.value='';husbandSend(v)}
  send.addEventListener('click',doSend);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
  startActTimer();
}

/* ===== SIDEBAR TOGGLE ===== */
function toggleSB(){
  var sb=$('#sidebar'),btn=$('#toggleSB');
  sb.classList.toggle('collapsed');
  btn.textContent=sb.classList.contains('collapsed')?'▷':'◁';
}

/* ===== NAVIGATION ===== */
function nextP(){if(!S.cast.length)return;S.currentIdx=(S.currentIdx+1)%S.cast.length;chatHist=[];renderProfile();renderList();if(!S.cast[S.currentIdx].info)autoLoadInfo(S.cast[S.currentIdx]);resetT()}
function prevP(){if(!S.cast.length)return;S.currentIdx=(S.currentIdx-1+S.cast.length)%S.cast.length;chatHist=[];renderProfile();renderList();if(!S.cast[S.currentIdx].info)autoLoadInfo(S.cast[S.currentIdx]);resetT()}
function randP(){if(S.cast.length<2)return;var n;do{n=Math.floor(Math.random()*S.cast.length)}while(n===S.currentIdx);S.currentIdx=n;chatHist=[];renderProfile();renderList();if(!S.cast[S.currentIdx].info)autoLoadInfo(S.cast[S.currentIdx]);resetT()}
function toggleM(){
  if(!S.activities.length){toast('Chưa có task','err');return}
  S.mode=S.mode==='auto'?'manual':'auto';
  var pill=$('#modePill'),txt=$('#modeBtnText');
  if(S.mode==='auto'){pill.textContent='Tự động';pill.className='mode-pill auto';txt.textContent='⋮⋮';startTimers();toast('Tự động','ok')}
  else{pill.textContent='Thủ công';pill.className='mode-pill manual';txt.textContent='▶';stopTimers();toast('Thủ công','info')}
}

/* ===== TIMERS ===== */
function startActTimer(){if(actInt)clearInterval(actInt);actStart=Date.now();actInt=setInterval(function(){var el=$('#actTimer');if(!el){clearInterval(actInt);return}/* không dùng timer hiển thị nữa */},1000)}
function startTimers(){
  stopTimers();if(S.mode!=='auto'||!S.activities.length)return;
  activeInt=setInterval(function(){/* active thay đổi ngầm, wife nói lại */},60000);
  taskInt=setInterval(function(){},1200000);
}
function stopTimers(){if(activeInt){clearInterval(activeInt);activeInt=null}if(taskInt){clearInterval(taskInt);taskInt=null}}
function resetT(){if(S.mode==='auto')startTimers()}

/* ===== KEYS ===== */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(!S.cast.length)return;
  if(e.code==='Space'){e.preventDefault();randP()}
  else if(e.code==='ArrowLeft')prevP();
  else if(e.code==='ArrowRight')nextP();
  else if(e.key==='m'||e.key==='M')toggleM();
});

/* ===== INIT ===== */
function init(){
  $('#fileInputInfo').addEventListener('change',handleInfoLoad);
  $('#modeBtn').addEventListener('click',toggleM);
  $('#prevBtn').addEventListener('click',prevP);
  $('#nextBtn').addEventListener('click',nextP);
  $('#randomBtn').addEventListener('click',randP);
  $('#toggleSB').addEventListener('click',toggleSB);

  /* Key modal */
  $('#keyBtn').addEventListener('click',function(){showKM(function(){toast('Key đã cập nhật!','ok')})});
  $('#kmCancel').addEventListener('click',hideKM);
  $('#keyOverlay').addEventListener('click',hideKM);
  $('#kmSave').addEventListener('click',saveKM);
  $('#kmInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveKM()}if(e.key==='Escape')hideKM()});
  $('#kmChg').addEventListener('click',function(){$('#kmInput').value=gK().trim();$('#kmInput').type='text';$('#kmEye').textContent='◎';$('#kmSaved').style.display='none';$('#kmInput').focus()});
  $('#kmEye').addEventListener('click',function(){var i=$('#kmInput');if(i.type==='password'){i.type='text';this.textContent='◎'}else{i.type='password';this.textContent='◉'}});
  updKB();

  setTimeout(function(){$('#splash').classList.add('hide');setTimeout(function(){$('#splash').remove()},500)},500);
  scan();loadTasks();
}
init();
</script>
