<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Mặt Hàng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #1a1a2e;
            padding: 20px;
            color: #fff;
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 25px;
        }

        .toolbar {
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, input[type="text"] {
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            font-size: 14px;
            background: #0f3460;
            color: #fff;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #00a8cc;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #00d4ff;
            transform: translateY(-1px);
        }

        .trangthai {
            color: #00ff88;
            font-weight: bold;
            margin-left: auto;
        }

        /* === ✅ KHU VỰC HIỂN THỊ SẢN PHẨM === */
        #danhSach {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .nhom-khoi {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nhom-tieu-de {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
            padding-bottom: 10px;
            border-bottom: 2px solid #0f3460;
            margin-bottom: 15px;
        }

        .nhom-hang {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        /* === ✅ THẺ SẢN PHẨM CÓ ẢNH === */
        .card {
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 12px;
            background: #0f3460;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: 0.2s;
        }

        .card:hover {
            border-color: #00d4ff;
            box-shadow: 0 3px 10px rgba(0,212,255,0.2);
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: #fff;
            border-radius: 6px;
        }

        .no-img {
            display: none;
            text-align: center;
            color: #999;
            padding: 30px 10px;
            background: #1a1a2e;
            border-radius: 6px;
            height: 140px;
            line-height: 80px;
        }

        .name {
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            line-height: 1.4;
            min-height: 40px;
        }

        .info {
            font-size: 12px;
            color: #aaa;
        }

        .gia {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
        }

        .ban {
            color: #00ff88;
        }

        .mua-btn {
            background: #00a86b;
            color: white;
            margin-top: auto;
        }

        .mua-btn:hover {
            background: #00cc7a;
        }
    </style>
</head>
<body>

    <h1>📦 Quản Lý Mặt Hàng</h1>

    <div class="toolbar">
        <select id="chonNhom" onchange="locTheoNhom()">
            <option value="*">📋 TẤT CẢ NHÓM</option>
        </select>
        <input type="text" id="timKiem" placeholder="🔍 Gõ: banh-gao / xa-bong-cuc..." value="banh-gao">
        
        <button onclick="docFileTxt()">📂 Đọc File TXT</button>
        <button onclick="docLaiTuFile()">🔄 Đọc Lại Từ File</button>
        <button onclick="taiTuAPI()">🌐 Tìm từ API BHXX</button>
        <button onclick="luuDuLieu()">💾 Lưu Dữ Liệu</button>
        <button onclick="xuatFileMoi()">📄 Xuất File Mới</button>
        <button onclick="xoaTatCa()">🗑️ Xóa Hết</button>
        
        <span id="trangThai" class="trangthai"></span>
    </div>

    <!-- ✅ QUAN TRỌNG NHẤT: NƠI SẢN PHẨM ĐƯỢC HIỂN THỊ -->
    <div id="danhSach"></div>

    <script src="script22.js"></script>
</body>
</html>
